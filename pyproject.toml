[project]
name = "novelforge-engine"
version = "0.1.0"
description = "Provider-agnostic autonomous novel-writing pipeline engine (text-only): foundation, draft, revision, review, export."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
novelforge = "novelforge.cli:app"

[tool.setuptools.packages.find]
include = ["novelforge*"]
