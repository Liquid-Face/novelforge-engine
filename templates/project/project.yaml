project:
  title: "Working Title"
  language: ru
  genre: "dark fantasy"
  target_audience: adult
  chapters_total: 20
  chapter_length_words: [2200, 3200]
  total_length_words_target: 70000

llm:
  roles:
    writer:
      primary:
        provider: ollama
        base_url: "http://localhost:11434/v1"
        model: "qwen2.5:32b"
      fallback:
        provider: aitunnel
        base_url: "https://api.aitunnel.ru/v1"
        model: "claude-sonnet-4.6"
        api_key_env: AITUNNEL_API_KEY
    evaluator:
      primary:
        provider: aitunnel
        base_url: "https://api.aitunnel.ru/v1"
        model: "gpt-5.6-sol"
        api_key_env: AITUNNEL_API_KEY
      fallback:
        provider: aitunnel
        base_url: "https://api.aitunnel.ru/v1"
        model: "gemini-3.7-flash"
        api_key_env: AITUNNEL_API_KEY
    reviewer:
      primary:
        provider: aitunnel
        base_url: "https://api.aitunnel.ru/v1"
        model: "gemini-3.7-flash"
        api_key_env: AITUNNEL_API_KEY
      fallback:
        provider: aitunnel
        base_url: "https://api.aitunnel.ru/v1"
        model: "gpt-5.6-sol"
        api_key_env: AITUNNEL_API_KEY
  temperature: 0.9
  max_tokens: 4096
  request_timeout_s: 180

thresholds:
  foundation_score: 7.5
  foundation_max_iterations: 8
  lore_score: 7.0
  chapter_score: 6.0
  max_draft_retries: 5
  revision_plateau_delta: 0.5
  revision_max_cycles: 6
  review_max_rounds: 4
  review_stop_max_items: 2

export:
  typeset_engine: tectonic
  formats: [pdf, epub]
  trim_size: "5.5in x 8.5in"
  font: "EB Garamond"

paths:
  manuscript_dir: manuscript/chapters
  lore_dir: manuscript
  state_dir: state
  logs_dir: logs
  briefs_dir: state/briefs
  export_dir: export

logging:
  console_verbosity: normal
  log_to_file: false
  log_file_path: logs/run.log
  log_evaluate: true
